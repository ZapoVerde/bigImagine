# bigBrain stack — Dockge-managed, alongside the other stacks under /opt/stacks.
# Services land in build order:
#   Phase 1 — postgres
#   Phase 4 — orchestrator, doc-sandbox (this file)
#   Phase 4 (external) — open-webui reaches orchestrator over traefik-net by container name;
#     see stacks/open-webui for that stack's own compose file

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bigbrain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BIGBRAIN_PG_SUPERUSER:-bigbrain_admin}
      POSTGRES_PASSWORD: ${BIGBRAIN_PG_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_DB: bigbrain
      BIGBRAIN_APP_PASSWORD: ${BIGBRAIN_APP_PASSWORD:?set in .env}
    volumes:
      - bigbrain-pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - ./db/checks:/checks:ro
    # No published port: only reachable from other bigBrain containers on the compose-local
    # network. Nothing outside this stack needs direct DB access (principle #7 — clients talk
    # to the orchestrator's API, never the database), and Phase 5 keeps inbound closed anyway.

  # Isolated, internal-only conversion service for untrusted file uploads: docx/odt/rtf/doc via
  # headless LibreOffice, scanned-PDF OCR via poppler + Tesseract (doc-sandbox/). Kept as a
  # separate container rather than added to the orchestrator image because it parses
  # attacker-shaped binary formats with a heavyweight, historically CVE-prone toolchain
  # (LibreOffice especially) — a crafted upload crashing or resource-exhausting this container
  # only breaks file uploads, not the same process holding the Postgres pool, the field-encryption
  # key, every provider credential, and every household member's live session. LibreOffice and
  # Alpine (the orchestrator image's base) are also a poor pairing (musl-libc issues), so this runs
  # on Debian slim instead rather than forcing that tradeoff onto the main image.
  #
  # `default` network only — no `traefik-net`, no published port, reachable only by container name
  # from `orchestrator`, the same internal-only shape as `postgres`. mem_limit/pids_limit bound
  # what a single malicious conversion can do to the host regardless of any one binary's own
  # timeout (doc-sandbox/src/convertOffice.ts and ocrPdf.ts already bound wall-clock time per call).
  doc-sandbox:
    build:
      context: ./doc-sandbox
    container_name: bigbrain-doc-sandbox
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
    networks:
      - default

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bigbrain-orchestrator
    restart: unless-stopped
    depends_on:
      - postgres
      - doc-sandbox
    environment:
      BIGBRAIN_PG_HOST: postgres
      BIGBRAIN_PG_PORT: ${BIGBRAIN_PG_PORT:-5432}
      BIGBRAIN_PG_DATABASE: ${BIGBRAIN_PG_DATABASE:-bigbrain}
      BIGBRAIN_PG_APP_USER: bigbrain_app
      BIGBRAIN_APP_PASSWORD: ${BIGBRAIN_APP_PASSWORD:?set in .env}
      BIGBRAIN_LLM_PROFILES: ${BIGBRAIN_LLM_PROFILES:?set in .env}
      BIGBRAIN_LLM_ACTIVE_PROFILE: ${BIGBRAIN_LLM_ACTIVE_PROFILE:?set in .env}
      BIGBRAIN_EMBEDDINGS_PROVIDER: ${BIGBRAIN_EMBEDDINGS_PROVIDER:?set in .env}
      BIGBRAIN_EMBEDDINGS_MODEL: ${BIGBRAIN_EMBEDDINGS_MODEL:?set in .env}
      BIGBRAIN_EMBEDDINGS_API_KEY: ${BIGBRAIN_EMBEDDINGS_API_KEY:?set in .env}
      BIGBRAIN_EMBEDDINGS_OUTPUT_DIMENSION: ${BIGBRAIN_EMBEDDINGS_OUTPUT_DIMENSION:?set in .env}
      BIGBRAIN_API_KEYS: ${BIGBRAIN_API_KEYS:?set in .env}
      BIGBRAIN_ACCESS_TEAM_DOMAIN: ${BIGBRAIN_ACCESS_TEAM_DOMAIN:-}
      BIGBRAIN_ACCESS_AUD: ${BIGBRAIN_ACCESS_AUD:-}
      BIGBRAIN_ACCESS_EMAILS: ${BIGBRAIN_ACCESS_EMAILS:-}
      BIGBRAIN_ADMIN_API_KEY: ${BIGBRAIN_ADMIN_API_KEY:?set in .env}
      BIGBRAIN_FIELD_ENCRYPTION_KEY: ${BIGBRAIN_FIELD_ENCRYPTION_KEY:?set in .env}
      BIGBRAIN_NOTION_TOKEN: ${BIGBRAIN_NOTION_TOKEN:-}
      BIGBRAIN_NOTION_LISTS_DATA_SOURCE_ID: ${BIGBRAIN_NOTION_LISTS_DATA_SOURCE_ID:-}
      BIGBRAIN_NOTION_OWNER_USER_ID: ${BIGBRAIN_NOTION_OWNER_USER_ID:-}
      BIGBRAIN_CALENDAR_OWNER_USER_ID: ${BIGBRAIN_CALENDAR_OWNER_USER_ID:-}
      BIGBRAIN_COZI_ICS_URL: ${BIGBRAIN_COZI_ICS_URL:-}
      BIGBRAIN_OUTLOOK_ICS_URL: ${BIGBRAIN_OUTLOOK_ICS_URL:-}
      BIGBRAIN_MASK_WORK_CALENDAR: ${BIGBRAIN_MASK_WORK_CALENDAR:-false}
      BIGBRAIN_ORCHESTRATOR_PORT: 8787
      # docs/spec.md §6.6 — one local git repo per user under this directory (plugins/documents/
      # src/gitRepo.ts), on the named volume below so it survives an image rebuild. No remote, no
      # offsite backup yet — a known, deliberately unaddressed gap; see §6.6's note on it.
      BIGBRAIN_DOCUMENTS_DIR: /app/content
      # Hardcoded internal wiring an operator never edits, same category as BIGBRAIN_PG_HOST above
      # — not a bb_principles.md §12/§13 secret-or-setting decision, just how this container
      # reaches its sibling by compose-internal DNS name.
      BIGBRAIN_DOC_SANDBOX_URL: http://doc-sandbox:8788
    ports:
      # Loopback-only fallback for the frontend/Settings tab (frontend/, adminServer.ts) via
      # `ssh -L 8787:localhost:8787 <user>@<host>` then http://localhost:8787/ — kept alongside the
      # public route below, same dual-path precedent as open-webui's own LAN-direct port 3000 next
      # to its Traefik route.
      - "127.0.0.1:8787:8787"
    volumes:
      - ./orchestrator/logs:/app/orchestrator/logs
      - bigbrain-documents:/app/content
    networks:
      - default
      - traefik-net
    # Public route for bigbrain.your-domain.example (settings/admin now, a data-verification/visualization
    # surface for household members later) — see docs/spec.md §7's Correction for the tradeoff
    # this reverses. Google-login enforcement happens at Cloudflare Access on this hostname, not
    # here; Traefik/this container only ever see a request Access already approved. Every route
    # underneath still requires its own bearer token exactly as before (BIGBRAIN_ADMIN_API_KEY for
    # /v1/admin/*, BIGBRAIN_API_KEYS for chat/tools) — Access adds a household-identity gate in
    # front of that, it doesn't replace it. Open WebUI's own traffic still reaches this container
    # over traefik-net by container name, entirely separate from this hostname.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bigbrain.rule=Host(`bigbrain.your-domain.example`)"
      - "traefik.http.services.bigbrain.loadbalancer.server.port=8787"
      # Disambiguates which of this container's two networks Traefik should route through — it's
      # also on `default` (for Postgres), unlike open-webui/vaultwarden which only ever join
      # traefik-net.
      - "traefik.docker.network=traefik-net"

volumes:
  bigbrain-pgdata:
  bigbrain-documents:

networks:
  traefik-net:
    external: true
